name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  api:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ghcr.io/projektargus/sapsii-api:${{ env.RELEASE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  ui:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ui/Dockerfile
          push: true
          tags: ghcr.io/projektargus/sapsii-ui:${{ env.RELEASE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          build-args: |
            DEPLOYMENT_VERSION=${{ env.RELEASE_SHA }}
            NEXT_PUBLIC_CARTO_API_KEY=${{ vars.NEXT_PUBLIC_CARTO_API_KEY }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  manifest:
    needs: [api, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Write immutable deployment manifest
        env:
          API_DIGEST: ${{ needs.api.outputs.digest }}
          UI_DIGEST: ${{ needs.ui.outputs.digest }}
        run: |
          printf '{"commit":"%s","api":"ghcr.io/projektargus/sapsii-api@%s","ui":"ghcr.io/projektargus/sapsii-ui@%s"}\n' \
            "$RELEASE_SHA" "$API_DIGEST" "$UI_DIGEST" > deployment-manifest.json
          cat deployment-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-manifest-${{ env.RELEASE_SHA }}
          path: deployment-manifest.json
          retention-days: 30
