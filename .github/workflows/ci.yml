name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Assert the lockfile carries every platform's native binaries
        run: |
          node -e '
          const lock = require("./package-lock.json");
          const required = [
            "@rolldown/binding-linux-x64-gnu",
            "@tailwindcss/oxide-linux-x64-gnu",
            "@tailwindcss/oxide-linux-x64-musl",
            "lightningcss-linux-x64-gnu",
            "lightningcss-linux-x64-musl",
          ];
          const missing = required.filter((name) => !lock.packages[`node_modules/${name}`]);
          if (missing.length) {
            console.error("package-lock.json is missing native packages:", missing.join(", "));
            console.error("Regenerate it from a clean tree: rm -rf node_modules */node_modules package-lock.json && npm install");
            process.exit(1);
          }
          console.log("package-lock.json carries the Linux native binaries");
          '
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check --workspace @sapsii/db
      - run: npm run lint --workspace @sapsii/ui
      - run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate application Compose and Caddy
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
          docker run --rm \
            -e ARGUS_PUBLIC_HOST=argus.imxone.com \
            -e ARGUS_ADMIN_HOST=argus-admin.imxone.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate pinned Supabase override
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/supabase/supabase.git /tmp/supabase
          git -C /tmp/supabase sparse-checkout init --cone
          git -C /tmp/supabase sparse-checkout set docker
          git -C /tmp/supabase fetch --depth 1 origin "$(cat deploy/SUPABASE_VERSION)"
          git -C /tmp/supabase checkout --detach FETCH_HEAD
          docker compose \
            --project-directory /tmp/supabase/docker \
            --env-file /tmp/supabase/docker/.env.example \
            -f /tmp/supabase/docker/docker-compose.yml \
            -f "$PWD/deploy/supabase.override.yaml" \
            config --quiet
      - name: Validate deployment shell
        run: shellcheck deploy/*.sh

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: ui
            dockerfile: ui/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: sapsii-${{ matrix.name }}:ci
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            NEXT_PUBLIC_CARTO_API_KEY=${{ vars.NEXT_PUBLIC_CARTO_API_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
